# ── Conformance: graded, so a messy repo is still usable ─────────────────────
# A repo is not conformant or non-conformant. It sits at a level, and the level
# says what a consumer can offer. That makes conformance a ladder a customer
# climbs, not a gate that locks them out on day one with 200 legacy files.
# The paid engine sits at level 3, so the ladder matches the commercial model
# (ADR-090: the format is open, the engine is paid).
conformance_levels:
  0:
    name: readable
    requires: "Markdown in git. Frontmatter, where present, parses as YAML."
    unlocks: "Open, render, full-text search."
  1:
    name: typed
    requires: "Every document carries title, type and audience, with legal values."
    unlocks: "Filter by kind, route by audience, honour the privacy gate."
  2:
    name: linked
    requires: "Declared edges resolve to real paths. Directories over 10 documents carry index.md."
    unlocks: "Relation graph, impact analysis, progressive disclosure."
  3:
    name: live
    requires: "Execution and presence conventions (see profiles.live)."
    unlocks: "Board, runs, collaboration. This is the paid engine surface."

# ── Robustness: the rule that stops every revision breaking every customer ───
# Borrowed from OKF SPEC.md §11, and non-negotiable. A published standard whose
# consumers reject unfamiliar input cannot be revised without a flag day.
robustness:
  consumers_must_not_reject_on:
    - unknown type values
    - unknown additional frontmatter keys
    - broken cross-links
    - missing index.md
    - an unrecognised oac_version (attempt best-effort, never refuse)
  rationale: >
    A consumer degrades to the highest level it can satisfy and says so.
    It never refuses the repo.

# ── Profiles: optional conventions, each unlocking specific behaviour ────────
# These are documented because they are ALREADY load-bearing in the shipped
# client and were previously written down nowhere. Undocumented grammar that a
# product depends on is the definition of a standard that cannot be kept.
profiles:

  self-core:
    file: self-as-code.md
    description: "The operator's strategic identity. The one file the client parses today."
    frontmatter: [last_raised, next_raise]
    body_grammar:
      beats: >
        Level-two headings mapping to beat keys, case-insensitive, optional
        leading 'the': baseline, readme (also 'read me'), main, rewrite, floor,
        cut, commits (also 'commit'), refactor (also 'review', the heading new
        documents write from 1.10).
      invariants: "A heading 'Invariants' or 'the Invariants'."
      coasting: "An invariant line ending in [coasting]. The one machine-readable health signal."
      split: >
        A heading 'the split' holding one GFM table: Slice | Beat | Routing |
        Destination, found by header name, case-insensitively. Routing is CLOSED
        and bare: stays-personal, routes-to, promotable-unrouted. Destination is
        required when Routing is routes-to, as <unit> or <unit>/<venture>. A
        slice is a statement, never a file. Absent section means nothing has
        been routed, and everything stays personal (ADR-118 4, ADR-122 1).
    columns:
      routing: [stays-personal, routes-to, promotable-unrouted]
    source: products/oac-client/src/lib/parseSelfAsCode.ts
    reader: code/scripts/self-as-code-split.py

  live:
    description: "Execution conventions. Level 3, the paid engine surface."
    frontmatter: [sprint]
    body_grammar:
      items: >
        GFM task-list items, '- [ ]' / '- [x]' / '- [X]', also '*' bullets, at
        any indent. Lines inside fenced code blocks are never items.
      grouping: "headingPath is the nearest ancestor heading chain."
      deviation: >
        An indented blockquote directly under an item whose first line matches
        '> deviation (<authorId>, <YYYY-MM-DD>):'.
    source: products/oac-client/src/lib/live/checklist.ts

  pack:
    description: "The Context Core deep pack (ADR-094). A profile of the format, not a rival to it."
    files: [CLAUDE.md, README.md, CHANGELOG.md]
    dirs: [context-core/, decisions/, .claude/commands/]
    frontmatter: [version, last_updated, status]
    status_values: [seeded, draft, confirmed]
    note: >
      ADR-094 previously defined its own frontmatter schema. It now defers here.
      seeded/draft/confirmed survives as a legal pack subset because /install
      reads it and 172 files carry it.

  self-plane:
    description: "One person's own operation, private, above the businesses they run. ADR-118."
    manifest: [plane, operations]
    files: [self-as-code.md]
    dirs: [standards/, projects/, archive/, decisions/, evidence/]
    legacy_dirs: {history/: archive/, library/: evidence/}
    fields:
      venture: "The venture's slug. The join key: the baseline's ### block, standards/ventures/<slug>/, the split's Destination and the business repo in operations. ADR-126, the Self as Code standard 4."
      goal: "A goal that crosses to a business repo: <venture>/<slug>. Both repos carry the same id, because an edge cannot cross repos."
    contact_card:
      file: "README.md of a folder for one person, in standards/ (from 1.13, ADR-133 Rule 4)"
      fields: [name, emails, phone, company, kind, crm_person, next_step]
      emails: "flow-style list"
      phone: "E.164, quoted: \"+61400000000\""
      kind: [partner, customer, working-contact, friend, family]
      note: "Every field optional. A tool never overwrites a field a person filled in. Last contact is worked out from the folder, never a field."
    goal_cascade: "Goals link upward with the serves_goal edge (a path inside this repo), never a parent: key."
    body_grammar:
      spine: "self-as-code.md carries the self-core profile above."
      buckets: >
        SPADE (ADR-126, from 1.11). Filed by what you can act on, not by
        subject. standards/ is what you keep up with no end date, projects/ has an
        end date, archive/ is done or dropped, decisions/ holds one file per
        decision made, evidence/ is what you look things up in and cite.
        Readers accept the legacy names history/ (archive/) and library/
        (evidence/); a tool never moves a person's folders for them.
    note: >
      A private repo, so every document in it is `owner` by default. This is the
      destination 3.5 has been sending owner documents to since 1.7. Separate
      repo rather than a folder because a git host grants read at the repo, so
      one collaborator on one business would otherwise see the operator's
      identity and every other business. Lineage: filing by actionability is
      PARA, by Tiago Forte; SPADE is the same idea with a name you can say.

  systems:
    description: "What an operation runs on today. The counterpart to a Context Core. ADR-118."
    manifest: [plane]
    files: [systems/register.md]
    body_grammar:
      sections: >
        Up to three level-two sections, each holding one GFM table, all optional:
        '## Software' (one row per tool), '## Where the work lives' (one row per
        place files or records sit), '## Processes' (one row per repeated thing).
        A missing section means it was not captured, never an error.
      closed_columns: >
        Found by header name, case-insensitively. A consumer ignores columns it
        does not recognise; every other column is free text. A closed cell
        carries the BARE value: no bold, no code ticks, no trailing note.
        '| manual |', never '| **manual** |'. Emphasis defeats the grep the
        whole profile rests on.
    columns:
      connects_via: [api, mcp, scrape, none]
      runs: [manual, semi, automated]
      call: [keep, automate, build, replace, retire]
    note: >
      Rows because the point is counting: `Runs` turns 'we should automate more'
      into a number that moves, and both closed columns answer to `grep -c`,
      which is the only tooling this profile assumes. The reader is code/scripts/systems-register.py in the reference
      implementation; it checks the closed cells and counts the baseline. No logos, no per-app files, no frontmatter schema (ADR-107, and the
      scalar-reader reason behind array_style: flow).

# Values with no safe mapping. The backfill must NOT guess these; it lists
# them for a human. `internal` is a visibility statement wearing a type's
# clothes, which is exactly the confusion `audience:` exists to end.
type_manual_review:
  - internal
  # Added 1.5. These three describe a SUBJECT AREA, not a kind of document, so a
  # single target is always wrong for some of the files carrying them. In one
  # cohort pack `business_knowledge` covered a price list, a fabrication rule, a
  # materials reference and a positioning statement: `offer`, `guide`, `reference`
  # and `strategy` respectively. Until 1.5 all three aliased to `engagement`,
  # which means a customer or partner relationship document and was wrong for
  # every one of them.
  - business
  - business_knowledge
  - operations

# ── Where a document lives implies what KIND it is ───────────────────────────
# The other half of the backfill, and the half that was missing from the
# standard until 2026-09-12. It lived as a hardcoded table inside
# code/scripts/backfill-frontmatter.py, which meant the rule we ask every
# operator to follow was one we could not hand them. Now it ships.
#
# ORDERED: first match wins, so the specific precedes the general.
# NO FALLBACK: a path that matches nothing is left for a human. A fallback is
# how a vocabulary re-inflates, and this one reached 198 values before v1.
#
# Keyed by plane (ADR-118), because the two planes have different furniture.
# A business plane has engagements, campaigns and curriculum. A self plane has
# a spine, five folders filed by actionability (SPADE, ADR-126), and a life in
# them.
path_types:

  business:
    - ['(^|/)(README|index|overview)\.md$', index]
    - ['(^|/)CLAUDE\.md$', guide]
    - ['^SECURITY\.md$', standard]
    - ['facilitator-script', lesson]
    - ['^decisions/\d+-', adr]
    - ['^specs/', spec]
    - ['^brand/standards/', standard]
    - ['^build-logs/', build-log]
    - ['^reference/', reference]
    - ['^templates/', template]
    - ['^team/', profile]
    - ['-standard\.md$', standard]
    - ['^curriculum/', lesson]
    - ['-coach-feedback\.md$', coach-feedback]
    - ['coach-rollup\.md$', coach-feedback]
    - ['(^|/)transcripts?/', transcript]
    - ['-transcript\.md$', transcript]
    - ['-session-notes\.md$', session]
    - ['(^|/)sessions?/', session]
    - ['(^|/)campaigns/.*(email|linkedin)-', messaging]
    - ['(^|/)(email|comms)-[^/]*\.md$', correspondence]
    - ['proposal', offer]
    - ['prospect-brief\.md$', engagement]
    - ['engagement-(memo|shape|plan)\.md$', engagement]
    - ['cohort-plan\.md$', engagement]
    - ['task-bridge\.md$', report]
    - ['^campaigns/|(^|/)campaigns/', campaign]
    - ['^(icp|marketing|sales|gtm|services|content)/', strategy]
    - ['(^|/)reports?/', report]
    - ['(^|/)getting-started/', guide]
    - ['(^|/)research/', market-intel]
    - ['(^|/)(drive-ingest|documents)/', reference]
    - ['(^|/)100-day-plan/', strategy]
    - ['raise-the-floor', template]
    - ['(battlecard|battle-card|-comparison)\.md$', market-intel]
    - ['(architecture|-brief|-schema|-mockup|-design)\.md$', spec]
    - ['(curriculum-|per-role-prework)', lesson]
    - ['week-\d+-tasks\.md$', engagement]
    - ['(pricing|cohort-sizing)', offer]
    - ['(-configuration|config|tracking-links)\.md$', reference]
    - ['(welcome-message|^invite-|/invite-)', correspondence]
    - ['meeting-summary', session]
    - ['(marketing-plan|mutual-goals)', strategy]
    - ['-strategy\.md$', strategy]
    - ['(^|/)plans?/', strategy]
    - ['(^|/)drafts/', correspondence]
    - ['(^|/)[^/]*[Ee]vent[^/]*/', engagement]
    - ['^STRUCTURING-GUIDE\.md$', standard]
    - ['speak-framework', brand]
    - ['handover', guide]
    - ['(rollup|actions)\.md$', report]
    - ['^products/', spec]
    - ['^infrastructure/', spec]
    - ['^brand/personal-branding/', brand]
    - ['^agents/', agent]
    - ['^\.github/', template]
    - ['^brand/', brand]

  # ── The self plane ─────────────────────────────────────────────────────────
  # Derived from the first real migration (lopez-delon-ops, 2026-09-12). Every
  # rule here generalises: the next operator's `standards/` also holds bars
  # they hold, and their `archive/` is also done or dropped.
  # From 1.11 the folders are SPADE (ADR-126): `archive/` was `history/` and
  # `evidence/` was `library/`. The old names stay below as legacy rules,
  # because a repo made before 1.11 keeps its folders until its owner renames
  # them.
  self:
    - ['(^|/)(README|index|overview)\.md$', index]
    - ['(^|/)CLAUDE\.md$', guide]
    # The spine. Its own profile (`self-core`) describes the body grammar;
    # this says what kind of document it is.
    - ['^self-as-code\.md$', strategy]
    - ['^decisions/\d+-', adr]
    # The thing you copy to make the next ADR is a template, not an ADR.
    # Must follow the numbered rule and precede nothing in particular.
    - ['(^|/)template\.md$', template]
    # A guide is a guide wherever it sits. Must precede the templates rule,
    # which would otherwise call a setup walkthrough a template.
    - ['-(guide|setup|reference)\.md$', guide]
    - ['^evidence/templates/', template]
    - ['^evidence/', reference]
    - ['^library/templates/', template]     # legacy name for evidence/
    - ['^library/', reference]              # legacy name for evidence/
    # The SPADE folders. `standards/` is the bar you hold, so a document in it
    # is usually the statement of that bar.
    - ['^standards/self/(goals|weeks)/', strategy]
    - ['^standards/self/vision\.md$', strategy]
    - ['^standards/ventures/[^/]+/(goals|milestones)', strategy]
    - ['^standards/ventures/.*/partnerships/', report]
    - ['^standards/(household|finance)/', standard]
    - ['^projects/', strategy]
    # `archive/` says the document is finished, never what kind it is, so it
    # is classified by what it was.
    - ['^archive/plans/', strategy]
    - ['^archive/team/', profile]
    - ['^archive/ventures/', strategy]
    - ['^history/plans/', strategy]          # legacy name for archive/
    - ['^history/team/', profile]            # legacy name for archive/
    - ['^history/ventures/', strategy]       # legacy name for archive/
    # Shared surfaces the post-session chain and the sweep produce.
    - ['(^|/)sessions?/', session]
    - ['-transcript\.md$', transcript]
    - ['-private-watch\.md$', report]
    - ['(^|/)correspondence/', correspondence]
    - ['(^|/)meetings/', session]
    - ['^inbox\.md$', report]

# The audience a backfill stamps on a document that carries none. Keyed by
# plane, and FAIL CLOSED in both: never stamp a value more shared than the
# plane's own floor. A self plane is owner-only by definition (ADR-111), so
# `owner` is both its floor and its constant. A business plane's floor is
# `internal`, never `team` or `public`, because over-sharing is the one
# mistake a backfill cannot undo.
audience_default:
  business: internal
  self: owner

# ── audience: who may read it ────────────────────────────────────────────────
# Load-bearing. code/scripts/audit-sensitive-content.py greps this field, and
# the gate is blind to any file that omits it.
audience:
  owner:    The owner only. In a shared repo, move it to the owner's own repo.
  internal: The organisation, including Tier 1 delivery partners.
  team:     Named collaborators on a specific engagement.
  public:   Safe to publish.

# `audience_note` is an OPTIONAL free-text companion, for when the real
# readership is richer than four values can hold: 'internal + share-ready with
# Luke', 'Operators and founders with zero dev background'. `audience` stays
# the enum a tool routes on; the note is for people. It exists because 22
# documents had written that sentence into `audience` itself, and collapsing
# them to the enum would have thrown the sentence away.

# `audience` is a ROUTING signal, not a security boundary. It says where a
# document may be shown. It enforces nothing; the git host does that. Tools
# that gate on it MUST fail closed: no `audience` means most restricted.

# `adam` was the drafting spelling of `owner`, renamed for two reasons.
# A published open standard cannot carry one person's name as an enum value:
# no other operation has an 'adam'. And the value collided with real people
# called Adam, which is why audit-sensitive-content.py had to stop prefix-
# matching after it flagged a client-facing proposal for a client named Adam.
# The gate reads both spellings until the backfill collapses them.
audience_value_aliases:
  adam: owner

# Legacy field spellings the gate reads until the backfill collapses them.
# 171 files across three field names before v1.
audience_aliases:
  internal_only: audience   # boolean; true -> internal
  visibility: audience      # same value set

# ── lifecycle: how the document behaves over time ────────────────────────────
# The consequence that matters: only `record` may be quoted verbatim by an
# agent. Quoting a `living` document as speech is how a coach's summary ends up
# attributed to a partner.
lifecycle:
  static:  A reference the operation reads and does not change.
  living:  Updated as the operation runs.
  record:  Written once, never edited. The only class safe to quote verbatim.

lifecycle_by_type:
  static: [standard, spec, template, reference, brand]
  living: [strategy, messaging, lesson, engagement, index, campaign, offer,
           market-intel, audience-def, guide, agent, profile]
  record: [transcript, session, coach-feedback, correspondence, build-log,
           contract, report, case-study, adr]

# ── status ───────────────────────────────────────────────────────────────────
# Ours, not OKF's. Their spec defaults to `stable`; we have richer states in
# use across 834 files and the ADR series depends on them.
status:
  common: [draft, active, complete, superseded]
  adr: [proposed, accepted, rejected, superseded]
  pack: [seeded, draft, confirmed]     # ADR-094 lifecycle, kept deliberately

# ── Fields some types add ────────────────────────────────────────────────────
# The three required fields apply everywhere. These are the EXTRA fields that
# carry weight for particular kinds of document. All optional: a missing one
# never costs a conformance level.
#
# This absorbs the five per-context schemas that used to live in
# STRUCTURING-GUIDE.md, which was one of the four rival definitions ADR-098
# set out to end. Those schemas invented `type` values that do not exist here
# (memo, plan, proposal, brief, summary, timeline). The kind of document is
# now the `type`; what it is about is `topics`; and the fields below are the
# handful of genuinely per-type extras.
type_fields:
  adr:            [adr, date, decision_date, supersedes, superseded_by, formerly]
  spec:           [version]
  standard:       [version]
  lesson:         [module]
  engagement:     [engagement, date]
  correspondence: [engagement, date]
  contract:       [engagement, date]
  offer:          [engagement, date]
  session:        [engagement, session_date, source]
  coach-feedback: [engagement, session_date]
  transcript:     [engagement, session_date, speaker_attribution, speakers, source]
  build-log:      [date]

# ── Edges: flat keys, never a nested block ───────────────────────────────────
# Flat because `grep -rn '^depends_on:'` must work. Nested YAML does not grep
# as one token, and grep is the whole retrieval mechanism under Rule 9.
# Every value is a path. The validator resolves all of them; an edge that does
# not resolve is an error. That is how the graph stops rotting.
edges:
  supersedes:    This replaces that.
  superseded_by: The inverse. Pair them.
  depends_on:    This breaks if that changes.
  serves_goal:   This contributes to that outcome.
  references:    Read-only pointer to a static document.
  derived_from:  This content came from that source.
  about:         Subject pointer to the canonical document on a topic.
  related:       Untyped. Deprecated, kept so 90 existing files do not break.

# Edges are REPO-LOCAL. Every value is a path inside the declaring repo, and at
# level 2 it must resolve. A path into another repository cannot be checked, so
# it is not an edge. Cross-repo relationships live in the manifest instead, as
# `plane` / `parent_operation` / `operations` (spec 4.1 and 6.3). Those are
# pointers, not paths: a consumer MUST NOT try to resolve them and MUST NOT fail
# a repo it cannot reach the other end of.
manifest_cross_repo:
  plane:            "self | business. Which kind of operation this repo is."
  parent_operation: "On a business plane, the self plane it was deployed from."
  operations:       "On a self plane, the business planes deployed from it."

# ── Transcript and session fields ────────────────────────────────────────────
# `speakers` maps a raw body label to a real person WITHOUT touching the body.
# That is deliberate: a 2026-08-04 incident was a bulk rewrite of
# a customer's files. The fix that adds a mapping beats the fix that rewrites
# the text.
speaker_attribution:
  labelled:  Names are already in the body (Zoom VTT). Derivable automatically.
  mapped:    Body has anonymous labels; `speakers` carries the mapping.
  anonymous: Nobody knows who is who. An agent MUST refuse to attribute.

transcript_required: [engagement, session_date, speaker_attribution]

# ── topics: the subject layer ────────────────────────────────────────────────
# Closed, unlike `tags`. Tags record where a file came from; topics record what
# is in it. Every hq-upload transcript currently carries the identical four
# provenance tags, which is why nothing is findable by subject.
# Seeded from tags used more than twice. Extend via .oac/manifest.yml.
topics:
  - positioning
  - pricing
  - partnership
  - equity
  - go-to-market
  - marketing
  - content
  - social
  - sales
  - onboarding
  - delivery
  - curriculum
  - cohort
  - product
  - platform
  - infrastructure
  - security
  - automation
  - agents
  - claude-code
  - github
  - repo-structure
  - frontmatter
  - context-core

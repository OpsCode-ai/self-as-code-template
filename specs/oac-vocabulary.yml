  # ── The self-plane collapse (added for ADR-118) ────────────────────────────
  # A self plane holds a life, not just a business, so it carries document
  # kinds an operations repo never sees: fitness programs, reading lists,
  # cleaning rotas, family planning. The SAME rule still settles every one of
  # them, and that is the point worth teaching: `type` is what a document IS.
  #
  #   A fitness program, a cleaning rota and a revenue target are all
  #   'an ongoing rule you hold yourself to'          -> standard
  #   A fitness log, an expense tracker and a retro are all
  #   'where things stood when I looked'              -> report
  #   A vision, an OKR, a weekly plan and a venture roadmap are all
  #   'where I am trying to get to'                   -> strategy
  #
  # 26 types held. Nothing here needed a 27th, which is the strongest evidence
  # yet that the collapse from 198 was real rather than lucky.
  # `strategic-identity` and `project` already map to strategy above; the
  # self plane simply proved them right a second time.

# OaC File Format v1: the machine-readable vocabulary.
#
# The human standard is specs/oac-file-format.md. The decision is ADR-098.
# This file is what `code/scripts/oac-validate.py` reads. One file, so there is
# exactly one place a value can be legal.
#
# THE RULE THAT KEEPS THIS SHORT:
#   `type` says what KIND of document this is, never what it is ABOUT.
#   Subject goes in `topics`. Provenance goes in `tags`.
# Without that rule this list grows back. It reached 198 values before v1.

version: "1.13"  # quoted: unquoted, YAML reads 1.10 as the number 1.1

# ── How values are written ───────────────────────────────────────────────────
# Lists MUST use flow style: `topics: [positioning, pricing]`.
# NOT block style:
#   topics:
#     - positioning
#
# This is not taste. The shipped reference client parses frontmatter with a
# scalar-only splitter (products/oac-client/src/lib/parseSelfAsCode.ts):
#   "arrays/nested blocks are ignored"  /  "skip list items / nested / blank"
# Under block style it sees `topics` as an empty string and the values vanish.
# Under flow style it sees the raw string `[positioning, pricing]`, which it can
# store, round-trip and later parse. A format its own reference implementation
# cannot read is fiction, so the format bends here rather than the client.
array_style: flow

# ── Required on every OaC document ───────────────────────────────────────────
required:
  - title
  - type
  - audience

recommended:
  - summary        # one plain sentence; feeds generated index.md
  - status
  - lifecycle
  - owner
  - updated
  - topics
  - tags

# Field names that mean the same thing as a canonical one. Read by consumers
# and by the backfill; the left side is not legal to write in new documents.
# `last_updated` is the big one: ADR-094 mandated it and 172 pack files carry
# it. `related_adrs` came from STRUCTURING-GUIDE and is just a typed edge.
field_aliases:
  last_updated: updated
  # READ as `references`, but do not mechanically rename it: its values are
  # bare ADR numbers, and `references` values must be paths that resolve.
  # Converting them is ambiguous, because SC-era and OpsCode ADR numbers
  # overlap. 43 files, awaiting a human.
  related_adrs: references

# ── type: what KIND of document ──────────────────────────────────────────────
# 26 values. Each has a real home in the tree. If a document does not fit,
# it goes to the manual bucket and a human decides. There is deliberately no
# `document` fallback: a catch-all is how 198 values happened.
types:
  adr:            Architecture decision record
  spec:           Technical specification or design
  standard:       An org-wide rule we hold ourselves to
  template:       A thing to copy and fill in
  index:          Directory listing or map, for progressive disclosure
  lesson:         Curriculum material
  guide:          How to do a thing, for a human
  strategy:       Direction, positioning, plans, identity
  market-intel:   What the market and competitors are doing
  audience-def: "Who we sell to: personas, ICPs, buyer language"
  messaging:      What we say to them
  offer:          What we sell and for how much
  brand:          Voice, visual identity, brand assets
  engagement:     A customer or partner relationship document
  session:        Notes or summary from a live session
  coach-feedback: Coach-facing assessment of a session
  transcript:     A verbatim record of what was said
  correspondence: Email and messages sent or received
  contract:       Commercial agreements and money documents
  campaign:       A marketing or outreach campaign
  build-log:      A documented build journey (Rule 8)
  report:         Point-in-time analysis, audit or status
  reference:      External system documentation we did not write
  case-study:     A story we tell about work we did
  agent:          An agent definition or prompt
  profile:        A person


  - name: charts
    kind: code
    upstream: ours
    version: 1
    licence: MIT
    path: lib/library.py
    note: Bar, line, sparkline and a plain table, drawn from numbers in the look's colours, each saying where its numbers came from. The reader beside this file in a pack, under scripts/lib in the hub. Ours, under MIT with the rest of the scripts (ADR-135).
  - name: elements
    kind: css
    upstream: ours
    version: 1
    licence: MIT
    path: elements.css
    note: The pieces a page is built from. Button, pill, card, table, letterhead, ladder, eyebrow. Every colour a variable the look sets.
  - name: effects
    kind: css
    upstream: ours
    version: 1
    licence: MIT
    path: effects.css
    note: Rise, grow, draw, lift, reveal. All inside prefers-reduced-motion no-preference. No script.
# Places to look, by name only. Never scraped, never embedded.
looked_at:
  - "refero.design: screenshots of other companies' products, paid and curated. A person browses it; nothing is taken from it (ADR-137 Rule 6)"
  - "uiverse.io (MIT), magicui (MIT), shadcn/ui (MIT): open elements. Not vendored, because most carry the look we avoid or need a framework. Checked 4 Nov 2026"
